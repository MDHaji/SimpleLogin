<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Student Form | Firebase</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 20, 30, 0.2), 0 6px 12px rgba(0, 0, 0, 0.05);
      padding: 2rem 2rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1.8rem;
      color: #1a2b4c;
      text-align: center;
      letter-spacing: -0.02em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    h1 i {
      color: #2a5c9a;
      font-size: 2rem;
    }

    .login-section {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e3a5f;
      margin-left: 0.5rem;
    }

    .input-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon i {
      position: absolute;
      left: 1rem;
      color: #557da5;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .input-icon input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      border: 1.5px solid #cbd6e6;
      border-radius: 3rem;
      font-size: 1rem;
      background: #ffffffd9;
      transition: all 0.2s ease;
      outline: none;
      color: #0b1e33;
    }

    .input-icon input:focus {
      border-color: #2a5c9a;
      box-shadow: 0 0 0 4px rgba(42, 92, 154, 0.15);
      background: #ffffff;
    }

    .input-icon input:focus + i {
      color: #2a5c9a;
    }

    .btn {
      border: none;
      border-radius: 3rem;
      padding: 0.9rem 1.8rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e3a5f;
      color: white;
      box-shadow: 0 8px 18px rgba(30, 58, 95, 0.3);
      margin-top: 0.5rem;
    }

    .btn:hover:not(:disabled) {
      background: #0f2a47;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(30, 58, 95, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 6px 12px rgba(30, 58, 95, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #eef3fc;
      color: #1e3a5f;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid #b9cbe0;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #dfe9f5;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .error-message {
      color: #b22234;
      font-size: 0.9rem;
      margin-top: 0.25rem;
      margin-left: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .error-message i {
      font-size: 0.9rem;
    }

    .student-section {
      display: none;
      flex-direction: column;
      gap: 1.2rem;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .student-section h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1a2b4c;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .student-section h2 i {
      color: #2a5c9a;
    }

    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 500px) {
      .two-cols {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.6rem;
      }
    }

    .input-group textarea {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid #cbd6e6;
      border-radius: 1.5rem;
      font-size: 1rem;
      background: #ffffffd9;
      resize: vertical;
      min-height: 90px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .input-group textarea:focus {
      border-color: #2a5c9a;
      box-shadow: 0 0 0 4px rgba(42, 92, 154, 0.15);
      background: #ffffff;
    }

    .input-group input[type="date"] {
      padding: 0.9rem 1rem;
    }

    .radio-group {
      display: flex;
      gap: 2rem;
      padding: 0.4rem 0.8rem;
      background: #f9fcff;
      border-radius: 2rem;
      border: 1.5px solid #cbd6e6;
      margin-top: 0.2rem;
      flex-wrap: wrap;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: #1e3a5f;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      accent-color: #2a5c9a;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .success-message {
      background: #e2f0e8;
      color: #146b3a;
      padding: 1rem 1.5rem;
      border-radius: 3rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 0.8rem;
      border: 1px solid #a8d5b8;
      animation: fadeIn 0.3s;
    }

    .error-box {
      background: #fde8ea;
      color: #b22234;
      padding: 1rem 1.5rem;
      border-radius: 3rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 0.8rem;
      border: 1px solid #f5c2c7;
      animation: fadeIn 0.3s;
    }

    .hidden {
      display: none !important;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .form-actions .btn {
      flex: 1;
      margin-top: 0;
    }

    .logout-link {
      text-align: center;
      font-size: 0.9rem;
      color: #557da5;
      cursor: pointer;
      text-decoration: underline dotted;
      margin-top: 0.5rem;
      transition: color 0.2s;
    }

    .logout-link:hover {
      color: #b22234;
    }

    .user-info {
      text-align: center;
      font-size: 0.85rem;
      color: #557da5;
      background: #f0f6ff;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .user-info i {
      color: #2a5c9a;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container" id="appContainer">
    <!-- LOGIN SECTION -->
    <div id="loginSection" class="login-section">
      <h1>
        <i class="fas fa-graduation-cap"></i> Student Portal
      </h1>
      <div class="input-group">
        <label for="loginEmail">Email</label>
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="student@example.com" autocomplete="email">
        </div>
      </div>
      <div class="input-group">
        <label for="loginPassword">Password</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password">
        </div>
      </div>
      <div id="loginError" class="error-message hidden">
        <i class="fas fa-exclamation-circle"></i> <span id="loginErrorText">Invalid credentials</span>
      </div>
      <button class="btn" id="loginBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> <span>Login</span>
      </button>
      <button class="btn btn-secondary" id="signupBtn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
      <div style="font-size: 0.8rem; text-align: center; color: #5e7a9b; margin-top: 0.5rem;">
        <i class="fas fa-fire"></i> Powered by Firebase Auth
      </div>
    </div>

    <!-- STUDENT DETAILS FORM SECTION -->
    <div id="studentSection" class="student-section">
      <h2>
        <i class="fas fa-address-card"></i> Student Details
      </h2>

      <div class="user-info">
        <i class="fas fa-user-circle"></i>
        Logged in as: <strong id="userEmailDisplay">—</strong>
      </div>

      <form id="studentForm" onsubmit="return false;">
        <div class="two-cols">
          <div class="input-group">
            <label for="fullName">Full name</label>
            <div class="input-icon">
              <i class="fas fa-user-graduate"></i>
              <input type="text" id="fullName" placeholder="John Doe" required>
            </div>
          </div>
          <div class="input-group">
            <label for="email">Email address</label>
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" placeholder="john@example.com" required>
            </div>
          </div>
        </div>

        <div class="two-cols">
          <div class="input-group">
            <label for="phone">Phone number</label>
            <div class="input-icon">
              <i class="fas fa-phone"></i>
              <input type="tel" id="phone" placeholder="+1 234 567 890" required>
            </div>
          </div>
          <div class="input-group">
            <label for="dob">Date of birth</label>
            <div class="input-icon">
              <i class="fas fa-calendar"></i>
              <input type="date" id="dob" required>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Gender</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="gender" value="male" checked> Male
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="female"> Female
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="other"> Other
            </label>
          </div>
        </div>

        <div class="input-group">
          <label for="course">Course / Program</label>
          <div class="input-icon">
            <i class="fas fa-book-open"></i>
            <input type="text" id="course" placeholder="Computer Science" required>
          </div>
        </div>

        <div class="input-group">
          <label for="address">Address</label>
          <textarea id="address" placeholder="123 Main St, City, Country"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn" id="saveBtn">
            <i class="fas fa-floppy-disk"></i> <span>Save Details</span>
          </button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">
            <i class="fas fa-rotate-left"></i> Reset
          </button>
        </div>
      </form>

      <div id="formSuccess" class="success-message hidden">
        <i class="fas fa-check-circle"></i> Student details saved to Firestore!
      </div>
      <div id="formError" class="error-box hidden">
        <i class="fas fa-circle-exclamation"></i> <span id="formErrorText">Something went wrong.</span>
      </div>

      <div class="logout-link" id="logoutLink">
        <i class="fas fa-sign-out-alt"></i> Logout
      </div>
    </div>
  </div>

  <!-- Firebase SDK + App Logic -->
  <script type="module">
    // ===== Firebase Imports =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ===== Firebase Configuration =====
    const firebaseConfig = {
      apiKey: "AIzaSyD3ttdcrzLm_EfB11G2m4f2C6jaXLKh_6A",
      authDomain: "simple-b198c.firebaseapp.com",
      projectId: "simple-b198c",
      storageBucket: "simple-b198c.firebasestorage.app",
      messagingSenderId: "333304303530",
      appId: "1:333304303530:web:e25e393c119bfad708e5d3",
      measurementId: "G-HZPLEREB33"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ===== DOM Elements =====
    const loginSection = document.getElementById('loginSection');
    const studentSection = document.getElementById('studentSection');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');
    const loginErrorText = document.getElementById('loginErrorText');
    const logoutLink = document.getElementById('logoutLink');
    const studentForm = document.getElementById('studentForm');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formSuccess = document.getElementById('formSuccess');
    const formError = document.getElementById('formError');
    const formErrorText = document.getElementById('formErrorText');
    const userEmailDisplay = document.getElementById('userEmailDisplay');

    // ===== Helpers =====
    function showLoginError(msg) {
      loginErrorText.textContent = msg;
      loginError.classList.remove('hidden');
    }

    function hideLoginError() {
      loginError.classList.add('hidden');
    }

    function showFormError(msg) {
      formErrorText.textContent = msg;
      formError.classList.remove('hidden');
      setTimeout(() => formError.classList.add('hidden'), 5000);
    }

    function setLoading(button, isLoading, label) {
      if (isLoading) {
        button.disabled = true;
        button.dataset.originalHtml = button.innerHTML;
        button.innerHTML = `<span class="spinner"></span> ${label || 'Please wait...'}`;
      } else {
        button.disabled = false;
        if (button.dataset.originalHtml) {
          button.innerHTML = button.dataset.originalHtml;
        }
      }
    }

    function resetStudentForm() {
      document.getElementById('fullName').value = '';
      document.getElementById('email').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('dob').value = '';
      document.querySelector('input[name="gender"][value="male"]').checked = true;
      document.getElementById('course').value = '';
      document.getElementById('address').value = '';
      formSuccess.classList.add('hidden');
      formError.classList.add('hidden');
    }

    function friendlyAuthError(code) {
      const map = {
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/email-already-in-use': 'This email is already registered. Try logging in.',
        'auth/weak-password': 'Password should be at least 6 characters.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
        'auth/network-request-failed': 'Network error. Check your connection.'
      };
      return map[code] || 'Authentication failed. Please try again.';
    }

    // ===== Auth: Login =====
    loginBtn.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value;

      if (!email || !password) {
        showLoginError('Please enter both email and password.');
        return;
      }

      hideLoginError();
      setLoading(loginBtn, true, 'Logging in...');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged will handle the UI switch
      } catch (err) {
        console.error('Login error:', err);
        showLoginError(friendlyAuthError(err.code));
      } finally {
        setLoading(loginBtn, false);
      }
    });

    // ===== Auth: Signup =====
    signupBtn.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value;

      if (!email || !password) {
        showLoginError('Enter an email and password (min 6 chars) to sign up.');
        return;
      }

      if (password.length < 6) {
        showLoginError('Password must be at least 6 characters.');
        return;
      }

      hideLoginError();
      setLoading(signupBtn, true, 'Creating...');

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged will switch the view
      } catch (err) {
        console.error('Signup error:', err);
        showLoginError(friendlyAuthError(err.code));
      } finally {
        setLoading(signupBtn, false);
      }
    });

    // Allow Enter key to trigger login
    [loginEmail, loginPassword].forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loginBtn.click();
        }
      });
    });

    // Clear error while typing
    loginEmail.addEventListener('input', hideLoginError);
    loginPassword.addEventListener('input', hideLoginError);

    // ===== Auth: Logout =====
    logoutLink.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (err) {
        console.error('Logout error:', err);
      }
    });

    // ===== Auth State Listener =====
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Logged in → show student form
        loginSection.style.display = 'none';
        studentSection.style.display = 'flex';
        userEmailDisplay.textContent = user.email;
        resetStudentForm();
      } else {
        // Logged out → show login
        studentSection.style.display = 'none';
        loginSection.style.display = 'flex';
        loginEmail.value = '';
        loginPassword.value = '';
        hideLoginError();
        resetStudentForm();
      }
    });

    // ===== Save Student Details to Firestore =====
    saveBtn.addEventListener('click', async () => {
      if (!studentForm.checkValidity()) {
        studentForm.reportValidity();
        return;
      }

      const user = auth.currentUser;
      if (!user) {
        showFormError('You must be logged in to save details.');
        return;
      }

      const studentData = {
        uid: user.uid,
        userEmail: user.email,
        fullName: document.getElementById('fullName').value.trim(),
        email:
